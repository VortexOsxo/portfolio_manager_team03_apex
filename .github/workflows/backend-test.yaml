name: Backend Tests

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
    
    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run the python tests
      run: python -m pytest tests/ -v